# dsh 全端 APP 出包（桌面 issue 09 / Android issue 12）
#
# 矩阵构建桌面三平台安装包 + Android APK：
#   - macOS  : universal dmg（aarch64 + x86_64 单个产物）
#   - Linux  : AppImage + deb（ubuntu-22.04，glibc 兼容面更广）
#   - Windows: msi（x64）
#   - Android: arm64-v8a debug APK（JDK 17 + Android SDK/NDK，见 build-android job；
#              iOS 不在此列——gen/apple 未生成且 init 需 macOS + XcodeGen，
#              见 app/README.md「iOS」节）
#
# 触发：push tag v*（产物附到 draft release）；workflow_dispatch 手动出包（产物上传
# workflow artifacts，不建 release）。
#
# 签名占位：本仓库暂无真实签名密钥，产物当前为未签名构建（macOS 未公证 / Windows
# 未签名 msi / Linux 无签名要求 / Android 用 debug 签名）。真实密钥就绪后在
# macOS/Windows job 注入签名环境变量（见下方「签名占位」注释），Android 切 release
# 出包并配 keystore（见 build-android 的「签名占位」注释），并开启 tauri.conf.json
# 的 updater 产物（createUpdaterArtifacts，见 app/README.md「自动更新」）。

name: apps-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # tag 构建时创建 draft release 并上传产物

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # universal：单个 dmg 同时覆盖 Apple Silicon 与 Intel
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: ''
          - os: windows-latest
            args: --bundles msi
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Tauri 2 官方 Linux 依赖（WebKitGTK 4.1 + 托盘 appindicator + librsvg）
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile
        working-directory: app

      # 签名占位：无真实密钥，当前产出未签名构建。启用签名时在对应平台解注释并
      # 配置 repo secrets（变量名即 Tauri 官方约定，见 tauri.app 签名文档）：
      #   macOS  : APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
      #            （公证另需 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）
      #   Windows: WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD（无则跳过签名）
      - name: Build bundles
        run: pnpm exec tauri build ${{ matrix.args }}
        working-directory: app

      # host 构建产物在 target/release/bundle，--target 交叉/通用构建在
      # target/<target>/release/bundle，统一用 ** 覆盖两种路径。
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/**/bundle/**/*.AppImage
            app/src-tauri/target/**/bundle/**/*.deb
            app/src-tauri/target/**/bundle/**/*.dmg
            app/src-tauri/target/**/bundle/**/*.msi

      # 仅 tag 构建：产物附到 draft release，人工核对后发布
      - name: Attach bundles to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: |
            app/src-tauri/target/**/bundle/**/*.AppImage
            app/src-tauri/target/**/bundle/**/*.deb
            app/src-tauri/target/**/bundle/**/*.dmg
            app/src-tauri/target/**/bundle/**/*.msi

  # Android APK（issue 12）：gen/android 工程入库（含 MainActivity 补丁），交叉编译
  # aarch64 Rust + gradle 打包。SDK 组件版本与 app/README.md「构建 debug APK」一致。
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 装 cmdline-tools + 预接受 SDK 许可，再补齐模板要求的组件
      #（platforms/build-tools 缺失时 gradle 也会自动补装，显式装更稳）
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" "platforms;android-36" \
            "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile
        working-directory: app

      # 签名占位：暂无 release keystore，出 debug APK（gradle 自动生成 debug 签名，
      # 可直接 adb install）。切 release 出包时：
      #   pnpm exec tauri android build --apk --target aarch64
      # 并配 tauri.properties 的 key.alias / key.store.password 等，keystore 入
      # CI secrets 后 base64 解码注入（见 tauri.app Android 签名文档）。
      - name: Build APK
        run: pnpm exec tauri android build --debug --apk --target aarch64
        working-directory: app

      # --target aarch64 时产物在 apk/aarch64/debug/，本地无 --target 时在
      # apk/universal/debug/（issue 12 实测），统一用 ** 覆盖。
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-android
          if-no-files-found: error
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk

      - name: Attach APK to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: app/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
