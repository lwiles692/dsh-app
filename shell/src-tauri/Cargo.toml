[package]
name = "dsh-shell"
version = "0.1.0"
description = "dsh desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
# 生产构建走 tauri:// 自定义协议加载本地资源（启动配置页）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
