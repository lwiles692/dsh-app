[package]
name = "dsh-shell"
version = "0.1.0"
description = "dsh desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# dialog：更新确认/提示用原生对话框（主窗口是远程页，不能走 webview 内 UI）。
# 移动端为 partial 支持（无文件夹选择器），本壳只用消息框，全平台可用。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# 桌面专属（issue 12）：tray-icon crate 与 muda 菜单无 Android/iOS 实现，
# single-instance / autostart / updater 插件移动端官方支持为 none
# （plugins-workspace 各 crate 的 package.metadata.platforms.support）。
# 按 target 门控依赖，配合 lib.rs 的 #[cfg(desktop)] 让移动构建不编入桌面代码。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# updater：自动更新（检查/下载/安装全在 Rust 侧触发，IPC 不暴露给远程网关页）。
tauri-plugin-updater = "2"

[features]
# 生产构建走 tauri:// 自定义协议加载本地资源（启动配置页）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
